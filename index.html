<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>삼남매 포트폴리오 대시보드</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--haein:#6366f1;--haein-light:#e0e7ff;--jiwon:#10b981;--jiwon-light:#d1fae5;--taehyun:#f59e0b;--taehyun-light:#fef3c7;--bg:#f8fafc;--card:#fff;--text:#1e293b;--sub:#64748b;--border:#e2e8f0;--red:#ef4444;--blue:#3b82f6;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.07)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

/* ─── HEADER ─── */
.header{background:linear-gradient(135deg,#1e293b,#334155);color:#fff;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.header h1{font-size:18px;font-weight:700}
.header-sub{font-size:12px;opacity:.65;margin-top:2px}
.header-right{display:flex;align-items:center;gap:10px;font-size:12px;opacity:.85}
.btn-refresh{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff;padding:6px 12px;border-radius:20px;cursor:pointer;font-size:12px;font-weight:600;transition:.2s}
.btn-refresh:hover{background:rgba(255,255,255,.25)}
.btn-refresh:disabled{opacity:.5;cursor:not-allowed}

/* ─── NAV ─── */
.nav{background:#fff;border-bottom:1px solid var(--border);padding:0 16px;display:flex;overflow-x:auto;-webkit-overflow-scrolling:touch;position:sticky;top:0;z-index:100;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav-tab{padding:13px 16px;font-size:13px;font-weight:600;cursor:pointer;border-bottom:3px solid transparent;color:var(--sub);white-space:nowrap;transition:.2s;flex-shrink:0}
.nav-tab.active-dashboard{color:#8b5cf6;border-color:#8b5cf6}
.nav-tab.active-haein{color:var(--haein);border-color:var(--haein)}
.nav-tab.active-jiwon{color:var(--jiwon);border-color:var(--jiwon)}
.nav-tab.active-taehyun{color:var(--taehyun);border-color:var(--taehyun)}

/* ─── MAIN ─── */
.main{padding:16px;max-width:1300px;margin:0 auto}
.page{display:none}.page.active{display:block}

/* ─── CARDS ─── */
.card{background:var(--card);border-radius:var(--radius);border:1px solid var(--border);padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}
.card h3{font-size:12px;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:.5px;margin-bottom:14px}

/* ─── SUMMARY ROW ─── */
.summary-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px}
.sc{background:var(--card);border-radius:var(--radius);border:1px solid var(--border);padding:16px;cursor:pointer;transition:.15s;box-shadow:var(--shadow)}
.sc:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.1)}
.sc.haein{border-top:4px solid var(--haein)}
.sc.jiwon{border-top:4px solid var(--jiwon)}
.sc.taehyun{border-top:4px solid var(--taehyun)}
.sc-name{font-size:14px;font-weight:700;margin-bottom:8px}
.sc-val{font-size:22px;font-weight:800}
.sc-ret{font-size:17px;font-weight:700;margin-top:4px}
.sc-meta{font-size:11px;color:var(--sub);margin-top:6px;display:flex;justify-content:space-between}

/* ─── FAMILY TOTAL ─── */
.family-card{background:linear-gradient(135deg,#1e293b,#334155);color:#fff;border-radius:var(--radius);padding:20px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
.family-total-val{font-size:28px;font-weight:800}
.family-total-ret{font-size:16px;opacity:.8;margin-top:4px}
.family-meta{display:flex;gap:24px;flex-wrap:wrap}
.family-meta-item{text-align:center}
.family-meta-item .label{font-size:11px;opacity:.6}
.family-meta-item .val{font-size:15px;font-weight:700;margin-top:2px}

/* ─── SUMMARY TEXT ─── */
.summary-text{font-size:13px;line-height:1.7;color:var(--text)}
.summary-highlight{display:inline-block;background:var(--bg);border-radius:6px;padding:2px 8px;font-weight:700;font-size:12px;margin:2px}

/* ─── STATS GRID ─── */
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.stat-box{background:var(--card);border-radius:var(--radius);border:1px solid var(--border);padding:14px;text-align:center}
.stat-label{font-size:10px;color:var(--sub);text-transform:uppercase;letter-spacing:.4px;margin-bottom:5px}
.stat-value{font-size:18px;font-weight:800}

/* ─── GRID ─── */
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}

/* ─── CHART ─── */
.chart-wrap{position:relative;height:200px}
.chart-wrap-lg{position:relative;height:280px}

/* ─── TABLE ─── */
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:var(--bg);padding:9px 10px;text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.4px;color:var(--sub);border-bottom:1px solid var(--border);white-space:nowrap;cursor:pointer;user-select:none}
th:hover{color:var(--text)}
td{padding:9px 10px;border-bottom:1px solid var(--border);white-space:nowrap;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#fafbfc}

/* ─── BADGES ─── */
.badge{display:inline-block;padding:2px 7px;border-radius:20px;font-size:10px;font-weight:700}
.badge-etf{background:#ede9fe;color:#7c3aed}
.badge-stock{background:#fce7f3;color:#be185d}
.badge-usetf{background:#dbeafe;color:#1d4ed8}
.badge-cash{background:#f1f5f9;color:#475569}
.badge-acct{background:var(--bg);color:var(--sub);border:1px solid var(--border)}
.badge-live{background:#dcfce7;color:#15803d;font-size:9px;padding:1px 5px}

/* ─── FILTER BAR ─── */
.filter-bar{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;align-items:center}
.filter-btn{padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600;border:1px solid var(--border);background:#fff;cursor:pointer;transition:.15s}
.filter-btn.active,.filter-btn:hover{background:var(--text);color:#fff;border-color:var(--text)}

/* ─── EDIT BUTTONS ─── */
.btn-edit{background:none;border:1px solid var(--border);color:var(--sub);padding:3px 8px;border-radius:6px;font-size:10px;cursor:pointer;transition:.15s}
.btn-edit:hover{background:var(--haein);color:#fff;border-color:var(--haein)}
.btn-del{background:none;border:1px solid #fecaca;color:var(--red);padding:3px 8px;border-radius:6px;font-size:10px;cursor:pointer;transition:.15s}
.btn-del:hover{background:var(--red);color:#fff}
.btn-add{background:var(--text);color:#fff;border:none;padding:7px 14px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;transition:.15s}
.btn-add:hover{background:#334155}
.btn-reset{background:none;border:1px solid var(--border);color:var(--sub);padding:7px 14px;border-radius:8px;font-size:12px;cursor:pointer}

/* ─── ACCT LIST ─── */
.acct-list{display:flex;flex-direction:column;gap:8px}
.acct-item{display:flex;align-items:center;gap:8px}
.acct-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.acct-name{font-size:12px;flex:1;font-weight:600}
.acct-val{font-size:12px;font-weight:600}
.acct-ret{font-size:11px;width:48px;text-align:right}

/* ─── MODAL ─── */
.modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.55);z-index:999;display:none;align-items:center;justify-content:center;padding:16px}
.modal-overlay.open{display:flex}
.modal-box{background:#fff;border-radius:16px;padding:24px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto}
.modal-title{font-size:16px;font-weight:800;margin-bottom:18px}
.form-row{margin-bottom:12px}
.form-row label{display:block;font-size:11px;font-weight:700;color:var(--sub);margin-bottom:4px;text-transform:uppercase}
.form-row input,.form-row select{width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:8px;font-size:13px;outline:none;transition:.15s}
.form-row input:focus,.form-row select:focus{border-color:var(--haein)}
.form-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modal-actions{display:flex;gap:8px;margin-top:18px;justify-content:flex-end}
.btn-modal-save{background:var(--haein);color:#fff;border:none;padding:9px 20px;border-radius:8px;font-weight:700;cursor:pointer;font-size:13px}
.btn-modal-del{background:var(--red);color:#fff;border:none;padding:9px 20px;border-radius:8px;font-weight:700;cursor:pointer;font-size:13px}
.btn-modal-cancel{background:var(--bg);color:var(--sub);border:1px solid var(--border);padding:9px 16px;border-radius:8px;cursor:pointer;font-size:13px}

/* ─── TOAST ─── */
.toast{position:fixed;bottom:20px;right:20px;background:#1e293b;color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;font-weight:600;z-index:2000;transform:translateY(60px);opacity:0;transition:.3s}
.toast.show{transform:translateY(0);opacity:1}

/* ─── LOADING ─── */
.loading-bar{height:3px;background:linear-gradient(90deg,var(--haein),var(--jiwon),var(--taehyun));position:fixed;top:0;left:0;right:0;z-index:9999;display:none;animation:loadanim 1.2s ease infinite}
@keyframes loadanim{0%{opacity:1}50%{opacity:.4}100%{opacity:1}}

/* ─── UP/DOWN ─── */
.up{color:var(--red)}.down{color:var(--blue)}

/* ─── MOBILE ─── */
@media(max-width:700px){
  .header h1{font-size:15px}
  .summary-row{grid-template-columns:1fr}
  .stats-grid{grid-template-columns:repeat(2,1fr)}
  .grid-2,.grid-3{grid-template-columns:1fr}
  .sc-val{font-size:18px}
  .sc-ret{font-size:14px}
  .family-total-val{font-size:22px}
  /* Card-style table on mobile */
  .mob-card thead{display:none}
  .mob-card tbody tr{display:block;border:1px solid var(--border);border-radius:10px;margin-bottom:10px;padding:10px 12px;background:#fff}
  .mob-card tbody td{display:flex;justify-content:space-between;align-items:center;padding:4px 0;border:none;font-size:12px;white-space:normal}
  .mob-card tbody td::before{content:attr(data-label);color:var(--sub);font-size:10px;font-weight:700;text-transform:uppercase;flex-shrink:0;margin-right:8px}
  .mob-card tbody td:first-child{font-size:13px;font-weight:700;margin-bottom:4px}
  .modal-box{padding:18px}
  .form-grid-2{grid-template-columns:1fr}
}
@media(max-width:400px){
  .main{padding:10px}
  .card{padding:14px}
}
</style>
</head>
<body>

<div class="loading-bar" id="loading-bar"></div>

<!-- HEADER -->
<div class="header">
  <div>
    <h1>🏦 삼남매 포트폴리오 대시보드</h1>
    <div class="header-sub">기준일: 2026-05-28 &nbsp;|&nbsp; <span id="live-badge" style="color:#86efac">● 정적 데이터</span></div>
  </div>
  <div class="header-right">
    <div id="usd-rate" style="font-size:11px">USD/KRW 1,380</div>
    <button class="btn-refresh" onclick="fetchLivePrices()" id="btn-refresh">📡 실시간 시세</button>
  </div>
</div>

<!-- NAV -->
<div class="nav">
  <div class="nav-tab active-dashboard" id="tab-dashboard" onclick="showPage('dashboard')">📊 대시보드</div>
  <div class="nav-tab" id="tab-haein" onclick="showPage('haein')">🔵 해인</div>
  <div class="nav-tab" id="tab-jiwon" onclick="showPage('jiwon')">🟢 지원</div>
  <div class="nav-tab" id="tab-taehyun" onclick="showPage('taehyun')">🟠 태현</div>
</div>

<div class="main">

<!-- ══════ DASHBOARD PAGE ══════ -->
<div class="page active" id="page-dashboard">
  <!-- Family total -->
  <div class="family-card" id="family-card"></div>

  <!-- 3 summary cards -->
  <div class="summary-row" id="summary-cards"></div>

  <!-- 3 strategy summaries -->
  <div class="grid-3" id="strategy-cards"></div>

  <!-- Charts -->
  <div class="grid-2">
    <div class="card">
      <h3>💰 총자산 비교 (억원)</h3>
      <div class="chart-wrap"><canvas id="chart-total"></canvas></div>
    </div>
    <div class="card">
      <h3>📈 수익률 비교</h3>
      <div class="chart-wrap"><canvas id="chart-return"></canvas></div>
    </div>
  </div>

  <!-- Type charts -->
  <div class="grid-3">
    <div class="card"><h3>🔵 해인 자산유형</h3><div class="chart-wrap"><canvas id="chart-haein-type"></canvas></div></div>
    <div class="card"><h3>🟢 지원 자산유형</h3><div class="chart-wrap"><canvas id="chart-jiwon-type"></canvas></div></div>
    <div class="card"><h3>🟠 태현 자산유형</h3><div class="chart-wrap"><canvas id="chart-taehyun-type"></canvas></div></div>
  </div>

  <!-- Compare table -->
  <div class="card">
    <h3>📋 종합 비교표</h3>
    <div class="table-wrap"><table id="compare-table"></table></div>
  </div>

  <!-- Common stocks -->
  <div class="card">
    <h3>🤝 공통 보유 종목</h3>
    <div class="table-wrap"><table id="common-table"></table></div>
  </div>
</div>

<!-- ══════ INDIVIDUAL PAGES ══════ -->
<div class="page" id="page-haein"><div id="detail-haein"></div></div>
<div class="page" id="page-jiwon"><div id="detail-jiwon"></div></div>
<div class="page" id="page-taehyun"><div id="detail-taehyun"></div></div>

</div><!-- /main -->

<!-- EDIT MODAL -->
<div class="modal-overlay" id="modal">
  <div class="modal-box">
    <div class="modal-title" id="modal-title">종목 편집</div>
    <input type="hidden" id="m-key">
    <input type="hidden" id="m-idx">
    <div class="form-row"><label>종목명</label><input id="m-name" type="text" placeholder="예: ACE 미국S&P500"></div>
    <div class="form-grid-2">
      <div class="form-row"><label>증권사</label><input id="m-broker" type="text" placeholder="미래에셋증권"></div>
      <div class="form-row"><label>계좌</label>
        <select id="m-acct"><option>위탁</option><option>ISA</option><option>IRP</option><option>연금</option><option>해외위탁</option></select>
      </div>
    </div>
    <div class="form-grid-2">
      <div class="form-row"><label>자산유형</label>
        <select id="m-type"><option>국내ETF</option><option>국내주식</option><option>미국ETF</option><option>미국주식</option><option>예금/현금</option></select>
      </div>
      <div class="form-row"><label>통화</label>
        <select id="m-currency"><option>KRW</option><option>USD</option></select>
      </div>
    </div>
    <div class="form-grid-2">
      <div class="form-row"><label>종목코드</label><input id="m-code" type="text" placeholder="360200"></div>
      <div class="form-row"><label>야후 티커</label><input id="m-ticker" type="text" placeholder="360200.KS"></div>
    </div>
    <div class="form-grid-2">
      <div class="form-row"><label>보유수량</label><input id="m-qty" type="number" min="0" step="any" oninput="updateBuyAmt()"></div>
      <div class="form-row"><label>매수단가</label><input id="m-buy-price" type="number" min="0" step="any" oninput="updateBuyAmt()"></div>
    </div>
    <div class="form-grid-2">
      <div class="form-row"><label>매수금액 (자동계산)</label><input id="m-buy-amt" type="number" readonly style="background:#f8fafc;color:var(--sub)"></div>
      <div class="form-row"><label>현재가</label><input id="m-cur-price" type="number" min="0" step="any"></div>
    </div>
    <div class="modal-actions">
      <button class="btn-modal-del" id="btn-modal-del" onclick="deleteHolding()" style="display:none">🗑 삭제</button>
      <button class="btn-modal-cancel" onclick="closeModal()">취소</button>
      <button class="btn-modal-save" onclick="saveHolding()">💾 저장</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ═══════════════════════════════════════════
// CONSTANTS & CONFIG
// ═══════════════════════════════════════════

let workingData = null; // { 해인:[], 지원:[], 태현:[] }

function loadData() {
  try {
    const s = localStorage.getItem(STORAGE_KEY);
    if (s) { workingData = JSON.parse(s); return; }
  } catch(e){}
  workingData = JSON.parse(JSON.stringify(RAW_ORIG));
}
function saveData() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(workingData)); } catch(e){}
}
function resetData(key) {
  const rawKey = key==='haein'?'해인':key==='jiwon'?'지원':'태현';
  workingData[rawKey] = JSON.parse(JSON.stringify(RAW_ORIG[rawKey]));
  saveData();
}

// HELPERS
// ═══════════════════════════════════════════
const fmt   = (n, d=0) => n == null || isNaN(n) ? '-' : n.toLocaleString('ko-KR',{maximumFractionDigits:d});
const fmtM  = n => n >= 1e8 ? (n/1e8).toFixed(1)+'억' : n >= 1e4 ? (n/1e4).toFixed(0)+'만' : fmt(n);
const retClr = r => r >= 0 ? 'var(--red)' : 'var(--blue)';
const retSign= r => r >= 0 ? '+' : '';

function calcCurVal(h) {
  if (h.type==='예금/현금') {
    if (h.currency==='USD' && h.qty>0) return h.qty * USD_KRW;
    return h.buy_amt;
  }
  if (h.currency==='USD') return h.qty * h.cur_price * USD_KRW;
  return h.qty * h.cur_price;
}

function enrichPortfolio(rows) {
  let tb=0, tc=0;
  const enriched = rows.map(h => {
    const curVal = calcCurVal(h);
    const gain   = curVal - h.buy_amt;
    const ret    = h.buy_amt > 0 ? (gain/h.buy_amt)*100 : 0;
    tb += h.buy_amt; tc += curVal;
    return {...h, curVal, gain, ret};
  });
  return { enriched, totalBuy:tb, totalCur:tc, totalGain:tc-tb, totalRet:tb>0?(tc-tb)/tb*100:0 };
}

function groupBy(arr, key) {
  return arr.reduce((acc,h)=>{
    const k=h[key]; if(!acc[k])acc[k]={buy:0,cur:0,items:[]};
    acc[k].buy+=h.buy_amt; acc[k].cur+=h.curVal; acc[k].items.push(h); return acc;
  },{});
}

// computed DATA
let DATA = {};
function recompute() {
  ['haein','jiwon','taehyun'].forEach(k=>{
    const rawKey = k==='haein'?'해인':k==='jiwon'?'지원':'태현';
    DATA[k] = enrichPortfolio(workingData[rawKey]);
  });
}

// chart registry
const charts = {};
function mkChart(id, cfg) {
  if (charts[id]) { charts[id].destroy(); delete charts[id]; }
  const el = document.getElementById(id);
  if (el) charts[id] = new Chart(el, cfg);
}

// LIVE PRICE FETCH
// ═══════════════════════════════════════════
let isLive = false;

// Decide if a holding should have its price updated from Yahoo
function shouldFetch(h) {
  if (!h.ticker || h.ticker==='-') return false;
  if (h.type==='예금/현금') return false;
  if (h.qty===0) return false;
  // Skip IRP "bundle" items (qty=1 with very high unit price = total amount)
  if (h.account==='IRP' && h.qty===1 && h.buy_price>200000 && h.currency==='KRW') return false;
  return true;
}

async function fetchLivePrices() {
  const btn = document.getElementById('btn-refresh');
  btn.disabled = true; btn.textContent = '⏳ 조회중...';
  document.getElementById('loading-bar').style.display = 'block';

  // Collect unique tickers
  const tickerSet = new Set();
  ['해인','지원','태현'].forEach(k => {
    workingData[k].forEach(h => { if(shouldFetch(h)) tickerSet.add(h.ticker); });
  });
  // Add USD/KRW rate
  tickerSet.add('USDKRW=X');

  const tickers = [...tickerSet];
  const priceMap = {};

  // Fetch in chunks of 10
  for (let i=0; i<tickers.length; i+=10) {
    const chunk = tickers.slice(i, i+10).join(',');
    try {
      const yahooUrl = `${YAHOO}${encodeURIComponent(chunk)}&lang=ko-KR&region=KR`;
      const res = await fetch(`${PROXY}${encodeURIComponent(yahooUrl)}`, {signal: AbortSignal.timeout(12000)});
      const json = await res.json();
      const parsed = JSON.parse(json.contents);
      (parsed.quoteResponse?.result || []).forEach(q => {
        priceMap[q.symbol] = q.regularMarketPrice;
      });
    } catch(e) { console.warn('Fetch chunk failed', e); }
  }

  // Update USD/KRW
  if (priceMap['USDKRW=X']) {
    USD_KRW = Math.round(priceMap['USDKRW=X']);
    document.getElementById('usd-rate').textContent = `USD/KRW ${fmt(USD_KRW)}`;
  }

  // Apply prices to workingData
  let updated = 0;
  ['해인','지원','태현'].forEach(k => {
    workingData[k].forEach(h => {
      if (shouldFetch(h) && priceMap[h.ticker] != null) {
        h.cur_price = priceMap[h.ticker];
        updated++;
      }
    });
  });

  saveData();
  recompute();

  document.getElementById('loading-bar').style.display = 'none';
  btn.disabled = false;
  btn.textContent = '📡 실시간 시세';

  if (updated > 0) {
    isLive = true;
    document.getElementById('live-badge').textContent = `● 실시간 (${updated}개 업데이트)`;
    document.getElementById('live-badge').style.color = '#4ade80';
    showToast(`✅ ${updated}개 종목 실시간 가격 업데이트 완료`);
    rerenderCurrent();
  } else {
    showToast('⚠️ 가격 조회 실패. 네트워크를 확인하세요.');
  }
}

function calcTopRet(key) {
  const top = DATA[key].enriched.filter(h=>h.type!=='예금/현금' && h.qty>1)
    .sort((a,b)=>b.ret-a.ret)[0];
  return top ? retSign(top.ret)+top.ret.toFixed(0)+'%' : '-';
}

function typeBadge(t){
  var c={'국내ETF':'badge-etf','국내주식':'badge-stock','미국ETF':'badge-usetf','미국주식':'badge-usetf','예금/현금':'badge-cash'};
  return '<span class="badge '+(c[t]||'badge-cash')+'">'+t+'</span>';
}

function renderTable(key, data) {
  var tbody = document.getElementById('tbody-'+key);
  if (!tbody) return;
  tbody.innerHTML = data.map(function(h) {
    var rStr = (h.ret>=0?'+':'')+h.ret.toFixed(1)+'%';
    var gStr = (h.gain>=0?'+':'')+fmtM(h.gain)+'원';
    var origIdx = DATA[key].enriched.indexOf(h);
    var liveTag = isLive && h.type!=='예금/현금' && h.ticker!=='-' ? ' <span class="badge badge-live">LIVE</span>' : '';
    return '<tr>'
      +'<td data-label="종목명"><strong>'+h.name+'</strong>'+liveTag+'<br><span style="font-size:10px;color:#94a3b8">'+h.ticker+'</span></td>'
      +'<td data-label="계좌"><span class="badge badge-acct">'+h.account+'</span></td>'
      +'<td data-label="유형">'+typeBadge(h.type)+'</td>'
      +'<td data-label="수량" style="text-align:right">'+fmt(h.qty)+'</td>'
      +'<td data-label="매수금액" style="text-align:right">'+fmtM(h.buy_amt)+'원</td>'
      +'<td data-label="현재가치" style="text-align:right">'+fmtM(h.curVal)+'원</td>'
      +'<td data-label="손익" style="text-align:right;color:'+retClr(h.gain)+'">'+gStr+'</td>'
      +'<td data-label="수익률" style="text-align:right;color:'+retClr(h.ret)+';font-weight:700">'+rStr+'</td>'
      +'<td style="text-align:center" data-label="편집"><button class="btn-edit" onclick="openModal(''+key+'','+origIdx+')">✏️</button></td>'
      +'</tr>';
  }).join('');
}

var sortState={};
function sortTable(key, col) {
  var d=DATA[key].enriched;
  if(sortState[key]===col){d.reverse();sortState[key]=null;}
  else{d.sort(function(a,b){return typeof a[col]==='string'?a[col].localeCompare(b[col]):b[col]-a[col];});sortState[key]=col;}
  var fb=document.querySelector('#filter-'+key+' .filter-btn.active');
  var acct=fb?fb.textContent:'전체';
  renderTable(key, acct==='전체'?d:d.filter(function(h){return h.account===acct;}));
}
function filterTable(key, acct, btn) {
  document.querySelectorAll('#filter-'+key+' .filter-btn').forEach(function(b){b.classList.remove('active');});
  btn.classList.add('active');
  renderTable(key, acct==='all'?DATA[key].enriched:DATA[key].enriched.filter(function(h){return h.account===acct;}));
}

var modalKey='', modalIdx=-1;

function openModal(key, idx) {
  modalKey=key; modalIdx=idx;
  document.getElementById('modal-title').textContent = idx===-1?'✨ 종목 추가':'✏️ 종목 편집';
  document.getElementById('btn-modal-del').style.display = idx===-1?'none':'block';
  if (idx===-1) {
    ['m-name','m-broker','m-code','m-ticker'].forEach(function(id){document.getElementById(id).value='';});
    ['m-qty','m-buy-price','m-buy-amt','m-cur-price'].forEach(function(id){document.getElementById(id).value='0';});
    document.getElementById('m-acct').value='위탁';
    document.getElementById('m-type').value='국내ETF';
    document.getElementById('m-currency').value='KRW';
  } else {
    var h=DATA[key].enriched[idx];
    document.getElementById('m-name').value=h.name;
    document.getElementById('m-broker').value=h.broker;
    document.getElementById('m-acct').value=h.account;
    document.getElementById('m-type').value=h.type;
    document.getElementById('m-currency').value=h.currency;
    document.getElementById('m-code').value=h.code||'';
    document.getElementById('m-ticker').value=h.ticker||'';
    document.getElementById('m-qty').value=h.qty;
    document.getElementById('m-buy-price').value=h.buy_price;
    document.getElementById('m-buy-amt').value=h.buy_amt;
    document.getElementById('m-cur-price').value=h.cur_price;
  }
  document.getElementById('modal').classList.add('open');
}
function closeModal(){document.getElementById('modal').classList.remove('open');}

function updateBuyAmt(){
  var q=+document.getElementById('m-qty').value||0;
  var p=+document.getElementById('m-buy-price').value||0;
  document.getElementById('m-buy-amt').value=Math.round(q*p);
}

function saveHolding(){
  var rawKey=modalKey==='haein'?'해인':modalKey==='jiwon'?'지원':'태현';
  var h={
    name:document.getElementById('m-name').value.trim(),
    broker:document.getElementById('m-broker').value.trim(),
    account:document.getElementById('m-acct').value,
    type:document.getElementById('m-type').value,
    currency:document.getElementById('m-currency').value,
    code:document.getElementById('m-code').value.trim()||'-',
    ticker:document.getElementById('m-ticker').value.trim()||'-',
    qty:+document.getElementById('m-qty').value||0,
    buy_price:+document.getElementById('m-buy-price').value||0,
    buy_amt:+document.getElementById('m-buy-amt').value||0,
    cur_price:+document.getElementById('m-cur-price').value||0,
    no:Date.now()
  };
  if(!h.name){showToast('⚠️ 종목명을 입력하세요');return;}
  if(modalIdx===-1){
    workingData[rawKey].push(h);
  } else {
    var origH=DATA[modalKey].enriched[modalIdx];
    var wi=workingData[rawKey].findIndex(function(x){return x.no===origH.no;});
    if(wi>=0) Object.assign(workingData[rawKey][wi],h);
  }
  saveData(); recompute();
  closeModal();
  renderIndividual(modalKey);
  showToast(modalIdx===-1?'✅ 종목 추가 완료':'✅ 수정 완료');
  if(currentPage==='dashboard'){rendered['dashboard']=false;renderDashboard();}
}

function deleteHolding(){
  if(!confirm('이 종목을 삭제하시겠습니까?'))return;
  var rawKey=modalKey==='haein'?'해인':modalKey==='jiwon'?'지원':'태현';
  var origH=DATA[modalKey].enriched[modalIdx];
  var wi=workingData[rawKey].findIndex(function(x){return x.no===origH.no;});
  if(wi>=0) workingData[rawKey].splice(wi,1);
  saveData(); recompute();
  closeModal();
  renderIndividual(modalKey);
  showToast('🗑 종목 삭제 완료');
}

  document.querySelectorAll('.nav-tab').forEach(function(t){t.className='nav-tab';});

  currentPage=p;

  else renderIndividual(p);

function showToast(msg){
  var t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){t.classList.remove('show');},3000);
}
