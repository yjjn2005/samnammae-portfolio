<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>삼남매 포트폴리오 대시보드</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root {
    --haein: #6366f1;
    --haein-light: #e0e7ff;
    --jiwon: #10b981;
    --jiwon-light: #d1fae5;
    --taehyun: #f59e0b;
    --taehyun-light: #fef3c7;
    --bg: #f8fafc;
    --card: #ffffff;
    --text: #1e293b;
    --sub: #64748b;
    --border: #e2e8f0;
    --red: #ef4444;
    --green: #10b981;
    --radius: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  /* Header */
  .header { background: linear-gradient(135deg, #1e293b 0%, #334155 100%); color: white; padding: 20px 24px; display: flex; justify-content: space-between; align-items: center; }
  .header h1 { font-size: 22px; font-weight: 700; }
  .header .date { font-size: 13px; opacity: 0.7; margin-top: 3px; }
  .header-right { text-align: right; font-size: 13px; opacity: 0.8; }

  /* Nav Tabs */
  .nav { background: white; border-bottom: 1px solid var(--border); padding: 0 24px; display: flex; gap: 0; position: sticky; top: 0; z-index: 100; }
  .nav-tab { padding: 14px 20px; font-size: 14px; font-weight: 600; cursor: pointer; border-bottom: 3px solid transparent; color: var(--sub); transition: all 0.2s; white-space: nowrap; }
  .nav-tab:hover { color: var(--text); }
  .nav-tab.active-haein { color: var(--haein); border-bottom-color: var(--haein); }
  .nav-tab.active-jiwon { color: var(--jiwon); border-bottom-color: var(--jiwon); }
  .nav-tab.active-taehyun { color: var(--taehyun); border-bottom-color: var(--taehyun); }
  .nav-tab.active-compare { color: #8b5cf6; border-bottom-color: #8b5cf6; }

  /* Main Layout */
  .main { padding: 20px 24px; max-width: 1400px; margin: 0 auto; }

  /* Summary Cards Top */
  .summary-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 20px; }
  .summary-card { background: var(--card); border-radius: var(--radius); padding: 18px 20px; border: 1px solid var(--border); cursor: pointer; transition: transform 0.15s, box-shadow 0.15s; }
  .summary-card:hover { transform: translateY(-2px); box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
  .summary-card.haein { border-top: 4px solid var(--haein); }
  .summary-card.jiwon { border-top: 4px solid var(--jiwon); }
  .summary-card.taehyun { border-top: 4px solid var(--taehyun); }
  .sc-name { font-size: 16px; font-weight: 700; margin-bottom: 10px; }
  .sc-val { font-size: 24px; font-weight: 800; margin-bottom: 4px; }
  .sc-sub { font-size: 12px; color: var(--sub); }
  .sc-ret { font-size: 20px; font-weight: 700; margin-top: 8px; }
  .sc-meta { display: flex; justify-content: space-between; margin-top: 8px; font-size: 12px; color: var(--sub); }
  .up { color: var(--red); }
  .down { color: #3b82f6; }

  /* Grid Layout */
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
  .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; margin-bottom: 16px; }

  /* Card */
  .card { background: var(--card); border-radius: var(--radius); border: 1px solid var(--border); padding: 20px; }
  .card h3 { font-size: 14px; font-weight: 700; color: var(--sub); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 16px; }

  /* Stats Grid */
  .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 16px; }
  .stat-box { background: var(--card); border-radius: var(--radius); border: 1px solid var(--border); padding: 16px; text-align: center; }
  .stat-label { font-size: 11px; color: var(--sub); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
  .stat-value { font-size: 20px; font-weight: 800; }
  .stat-sub { font-size: 11px; color: var(--sub); margin-top: 3px; }

  /* Table */
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { background: var(--bg); padding: 10px 12px; text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--sub); border-bottom: 1px solid var(--border); white-space: nowrap; cursor: pointer; user-select: none; }
  th:hover { color: var(--text); }
  td { padding: 10px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: var(--bg); }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 600; }
  .badge-etf { background: #ede9fe; color: #7c3aed; }
  .badge-stock { background: #fce7f3; color: #be185d; }
  .badge-usetf { background: #dbeafe; color: #1d4ed8; }
  .badge-cash { background: #f1f5f9; color: #475569; }
  .badge-acct { background: var(--bg); color: var(--sub); border: 1px solid var(--border); }

  /* Chart canvas containers */
  .chart-container { position: relative; height: 220px; }
  .chart-container-lg { position: relative; height: 300px; }

  /* Account breakdown */
  .acct-list { display: flex; flex-direction: column; gap: 8px; }
  .acct-item { display: flex; align-items: center; gap: 10px; }
  .acct-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .acct-name { font-size: 13px; flex: 1; }
  .acct-val { font-size: 13px; font-weight: 600; text-align: right; }
  .acct-pct { font-size: 11px; color: var(--sub); text-align: right; width: 40px; }
  .acct-bar-wrap { flex: 1; background: var(--bg); border-radius: 4px; height: 6px; overflow: hidden; }
  .acct-bar { height: 100%; border-radius: 4px; }

  /* Comparison table */
  .cmp-table table th:nth-child(1) { width: 160px; }
  .cmp-cell-haein { background: var(--haein-light) !important; color: var(--haein); font-weight: 700; }
  .cmp-cell-jiwon { background: var(--jiwon-light) !important; color: #065f46; font-weight: 700; }
  .cmp-cell-taehyun { background: var(--taehyun-light) !important; color: #92400e; font-weight: 700; }

  /* Page visibility */
  .page { display: none; }
  .page.active { display: block; }

  /* Filter bar */
  .filter-bar { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; align-items: center; }
  .filter-btn { padding: 5px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; border: 1px solid var(--border); background: white; cursor: pointer; transition: all 0.15s; }
  .filter-btn.active, .filter-btn:hover { background: var(--text); color: white; border-color: var(--text); }
  .filter-btn.active { }

  /* Top gain/loss table */
  .rank-num { width: 28px; height: 28px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; }
  .rank-1 { background: #fef08a; color: #713f12; }
  .rank-2 { background: #e2e8f0; color: #334155; }
  .rank-3 { background: #fed7aa; color: #7c2d12; }

  /* Section title */
  .section-title { font-size: 15px; font-weight: 700; margin-bottom: 12px; color: var(--text); }

  /* Responsive */
  @media (max-width: 768px) {
    .summary-row { grid-template-columns: 1fr; }
    .stats-grid { grid-template-columns: repeat(2, 1fr); }
    .grid-2, .grid-3 { grid-template-columns: 1fr; }
    .main { padding: 12px 16px; }
    .nav-tab { padding: 12px 14px; font-size: 13px; }
  }
</style>
</head>

const NAMES = { haein: '유해인', jiwon: '유지원', taehyun: '유태현' };
const EMOJIS = { haein: '🔵', jiwon: '🟢', taehyun: '🟠' };

const TYPE_COLORS = {
  '국내ETF': '#6366f1', '국내주식': '#f43f5e',
  '미국ETF': '#3b82f6', '미국주식': '#0ea5e9', '예금/현금': '#94a3b8'
};
const ACCT_COLORS = ['#6366f1','#10b981','#f59e0b','#f43f5e','#3b82f6','#8b5cf6','#06b6d4'];

function fmt(n, dec=0) {
  if (n == null || isNaN(n)) return '-';
  return n.toLocaleString('ko-KR', { maximumFractionDigits: dec });
}
function fmtM(n) {
  // format in millions (만원)
  if (n >= 100000000) return (n/100000000).toFixed(1) + '억';
  if (n >= 10000) return (n/10000).toFixed(0) + '만';
  return fmt(n);
}
function retColor(r) { return r >= 0 ? '#ef4444' : '#3b82f6'; }

// Calculate current value properly
function calcCurVal(h) {
  if (h.type === '예금/현금') {
    if (h.currency === 'USD' && h.qty > 0) return h.qty * USD_KRW;
    return h.buy_amt; // cash = cost basis
  }
  if (h.currency === 'USD') return h.qty * h.cur_price * USD_KRW;
  return h.qty * h.cur_price;
}

// Aggregate portfolio stats
function calcPortfolio(data) {
  let totalBuy = 0, totalCur = 0;
  const enriched = data.map(h => {
    const curVal = calcCurVal(h);
    const gain = curVal - h.buy_amt;
    const ret = h.buy_amt > 0 ? (gain / h.buy_amt) * 100 : 0;
    totalBuy += h.buy_amt;
    totalCur += curVal;
    return { ...h, curVal, gain, ret };
  });
  const totalGain = totalCur - totalBuy;
  const totalRet = totalBuy > 0 ? (totalGain / totalBuy) * 100 : 0;
  return { enriched, totalBuy, totalCur, totalGain, totalRet };
}

// Group by key
function groupBy(arr, key) {
  return arr.reduce((acc, h) => {
    const k = h[key];
    if (!acc[k]) acc[k] = { buy: 0, cur: 0, items: [] };
    acc[k].buy += h.buy_amt;
    acc[k].cur += h.curVal;
    acc[k].items.push(h);
    return acc;
  }, {});
}

// Build portfolio data

                <div class="acct-dot" style="background:${TYPE_COLORS[t]||'#94a3b8'}"></div>
                <div class="acct-name"><strong>${t}</strong></div>
                <div class="acct-val">${fmtM(g.cur)}원</div>
                <div class="acct-pct" style="color:${retColor(+ret)}">${ret>=0?'+':''}${ret}%</div>
                <div style="width:50px;font-size:11px;color:#94a3b8;text-align:right">${pct}%</div>
              </div>`;
            }).join('')}
          </div>
        </div>
      </div>
    </div>

    <div class="card">
      <h3>📋 보유종목 전체 현황</h3>
      <div class="filter-bar" id="filter-${key}">
        <span style="font-size:12px;color:#64748b;margin-right:4px">계좌:</span>
        <button class="filter-btn active" onclick="filterTable('${key}', 'all', this)">전체</button>
        ${acctKeys.map(a => `<button class="filter-btn" onclick="filterTable('${key}', '${a}', this)">${a}</button>`).join('')}
      </div>
      <div class="table-wrap">
        <table id="table-${key}">
          <thead>
            <tr>
              <th onclick="sortTable('${key}','name')">종목명 ↕</th>
              <th onclick="sortTable('${key}','account')">계좌</th>
              <th onclick="sortTable('${key}','type')">유형</th>
              <th onclick="sortTable('${key}','buy_amt')" style="text-align:right">매수금액 ↕</th>
              <th onclick="sortTable('${key}','curVal')" style="text-align:right">현재가치 ↕</th>
              <th onclick="sortTable('${key}','gain')" style="text-align:right">손익 ↕</th>
              <th onclick="sortTable('${key}','ret')" style="text-align:right">수익률 ↕</th>
            </tr>
          </thead>
          <tbody id="tbody-${key}"></tbody>
        </table>
      </div>
    </div>`;

  document.getElementById(`detail-${key}`).innerHTML = html;

  // Render table
  renderTable(key, sorted);

  // Charts
  setTimeout(() => {
    // Account donut
    new Chart(document.getElementById(`chart-${key}-acct`), {
      type: 'doughnut',
      data: {
        labels: acctKeys,
        datasets: [{ data: acctKeys.map(a => acctGroups[a].cur), backgroundColor: acctKeys.map((_,i) => ACCT_COLORS[i % ACCT_COLORS.length]), borderWidth: 2 }]
      },
      options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
    });
    // Type donut
    new Chart(document.getElementById(`chart-${key}-type2`), {
      type: 'doughnut',
      data: {
        labels: typeKeys,
        datasets: [{ data: typeKeys.map(t => typeGroups[t].cur), backgroundColor: typeKeys.map(t => TYPE_COLORS[t]||'#94a3b8'), borderWidth: 2 }]
      },
      options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
    });
  }, 50);
}

function typeBadge(t) {
  const cls = { '국내ETF': 'badge-etf', '국내주식': 'badge-stock', '미국ETF': 'badge-usetf', '미국주식': 'badge-usetf', '예금/현금': 'badge-cash' };
  return `<span class="badge ${cls[t]||'badge-cash'}">${t}</span>`;
}

function renderTable(key, data) {
  const tbody = document.getElementById(`tbody-${key}`);
  tbody.innerHTML = data.map(h => {
    const retStr = h.ret >= 0 ? `+${h.ret.toFixed(1)}%` : `${h.ret.toFixed(1)}%`;
    const gainStr = h.gain >= 0 ? `+${fmtM(h.gain)}` : fmtM(h.gain);
    return `<tr>
      <td><strong>${h.name}</strong><br><span style="font-size:11px;color:#94a3b8">${h.ticker || h.code}</span></td>
      <td><span class="badge badge-acct">${h.account}</span></td>
      <td>${typeBadge(h.type)}</td>
      <td style="text-align:right">${fmtM(h.buy_amt)}원</td>
      <td style="text-align:right">${fmtM(h.curVal)}원</td>
      <td style="text-align:right;color:${retColor(h.gain)}">${gainStr}원</td>
      <td style="text-align:right;color:${retColor(h.ret)};font-weight:700">${retStr}</td>
    </tr>`;
  }).join('');
}

let sortState = {};
function sortTable(key, col) {
  const d = DATA[key].enriched;
  if (sortState[key] === col) { d.reverse(); sortState[key] = null; }
  else {
    d.sort((a,b) => {
      const va = a[col], vb = b[col];
      return typeof va === 'string' ? va.localeCompare(vb) : vb - va;
    });
    sortState[key] = col;
  }
  const filter = document.querySelector(`#filter-${key} .filter-btn.active`)?.textContent || '전체';
  if (filter === '전체') renderTable(key, d);
  else renderTable(key, d.filter(h => h.account === filter));
}

function filterTable(key, acct, btn) {
  document.querySelectorAll(`#filter-${key} .filter-btn`).forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const d = DATA[key].enriched;
  renderTable(key, acct === 'all' ? d : d.filter(h => h.account === acct));
}

// ===================== PAGE ROUTING =====================
const pageRendered = {};
function showPage(p) {
  document.querySelectorAll('.page').forEach(el => el.classList.remove('active'));
  document.getElementById(`page-${p}`).classList.add('active');
  document.querySelectorAll('.nav-tab').forEach(t => t.className = 'nav-tab');
  const tab = document.getElementById(`tab-${p}`);
  tab.className = `nav-tab active-${p}`;

  if (!pageRendered[p]) {
    pageRendered[p] = true;
    if (['haein','jiwon','taehyun'].includes(p)) renderIndividual(p);
  }
}

// ===================== INIT =====================
renderSummaryCards();
renderCompareCharts();
renderCompareTable();
renderCommonStocks();
pageRendered['compare'] = true;
</script>
